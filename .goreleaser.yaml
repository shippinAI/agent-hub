# GoReleaser v2: binaries for the bridge (devagotchi) and the hub (hub-server, hub CLI), archives, checksums,
# SBOMs (syft) and a cosign keyless signature bundle over checksums.txt. release-please creates the tag and
# the release (with its changelog); GoReleaser only adds assets. Images are built by images.yml (buildx).
# Docs: docs/devagotchi/38-ci-containers.md. Local dry run: goreleaser release --snapshot --clean --skip=sign,sbom
version: 2
project_name: devagotchi
before:
  hooks:
    - npm --prefix web ci --no-audit --no-fund
    - npm --prefix web run build
builds:
  - id: devagotchi
    dir: bridge
    main: ./cmd/devagotchi
    binary: devagotchi
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -buildid= -X devagotchi/bridge/buildinfo.Version={{ .Version }} -X devagotchi/bridge/buildinfo.Commit={{ .ShortCommit }} -X devagotchi/bridge/buildinfo.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: hub-server
    dir: server
    main: ./cmd/hub-server
    binary: hub-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -buildid=]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: hub
    dir: server
    main: ./cmd/hub
    binary: hub
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -buildid=]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - id: devagotchi
    ids: [devagotchi]
    name_template: "devagotchi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: agent-hub
    ids: [hub-server, hub]
    name_template: "agent-hub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    allow_different_binary_count: true # windows ships the hub CLI only
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
signs:
  - id: checksums-keyless
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
release:
  mode: keep-existing
changelog:
  disable: true
snapshot:
  version_template: "{{ incpatch .Version }}-next"
