# Multi-arch OCI images (linux/amd64 + linux/arm64) for hub-server and the bridge: buildx with GitHub Actions
# cache, max-level SLSA provenance + SBOM attestations, GHCR push, cosign keyless signature and a GitHub
# artifact attestation per digest. PRs build without pushing. Docs: docs/devagotchi/38-ci-containers.md.
name: images
on:
  push:
    branches: [main]
  pull_request:
    paths: ["deploy/docker/**", "server/**", "bridge/**", "web/**", ".github/workflows/images.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: release tag to build (vX.Y.Z); release-please calls this because its tags do not trigger workflows
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub-server
            file: deploy/docker/hub-server.Dockerfile
          - name: devagotchi-bridge
            file: deploy/docker/bridge.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: image name (GHCR needs lowercase)
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=edge,branch=main
            type=ref,event=pr
            type=sha
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ inputs.tag || github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'
      - name: cosign keyless sign (GitHub OIDC -> Fulcio, logged in Rekor)
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
